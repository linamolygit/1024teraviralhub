  <!-- Outer Card / Base -->
  <rect width="48" height="48" rx="10" fill="#1E293B" fill-opacity="0.05" />
  
  <!-- Google Ad Manager / AdX Stylized Emblem -->
  <!-- Upper Left (Yellow) -->
  <path d="M12 16 C12 13.79 13.79 12 16 12 L24 12 L19 23 L12 23 Z" fill="url(#adx_yellow)" />
  
  <!-- Upper Right (Blue) -->
  <path d="M24 12 L32 12 C34.21 12 36 13.79 36 16 L36 23 L25 23 Z" fill="url(#adx_blue)" />
  
