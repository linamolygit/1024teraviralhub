  <path d="M18 20 L30 20 L26 28 L14 28 Z" fill="#FFFFFF" fill-opacity="0.95" filter="url(#adx_shadow)" />
  <path d="M21 22 L27 22 L24 26 L18 26 Z" fill="#1A73E8" />
  
  <!-- Subtle AdX typography badge -->
  <text x="24" y="44" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="900" fill="#38BDF8" letter-spacing="0.5">AdX / GAM</text>
